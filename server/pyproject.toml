[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inkdesk-server"
version = "0.2.0"
description = "Inkdesk Python main backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "httpx>=0.27,<1.0",
  "watchdog>=4.0,<7.0",
  "pyyaml>=6.0,<7.0",
  "inkdesk-skill-sdk"
]

[project.optional-dependencies]
claude = [
  "claude-agent-sdk>=0.2.114,<0.3"
]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0"
]

[project.scripts]
inkdesk = "inkdesk_skill_sdk.cli:main"
inkdesk-skill = "inkdesk_skill_sdk.cli:main"

[tool.setuptools.packages.find]
include = ["inkdesk_server*", "inkdesk_skill_sdk*"]

[tool.setuptools.package-data]
"inkdesk_server.harness.vendor" = ["*.md", "LICENSE.*", "profiles/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
