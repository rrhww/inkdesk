[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inkdesk-skill-sdk"
version = "0.1.0"
description = "Inkdesk Skill Development Kit — contract models, validators, scaffolder, registry, routing graph"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8,<3.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
]

[project.scripts]
inkdesk-skill = "inkdesk_skill_sdk.cli:main"

[tool.setuptools.packages.find]
include = ["inkdesk_skill_sdk*"]
